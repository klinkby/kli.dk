name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only allow one deployment at a time, and don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.145.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # .GitInfo and .Lastmod
          submodules: recursive # cactus theme

      - name: Install Hugo
        run: |
          curl -sSLf -o /tmp/hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i /tmp/hugo.deb
          hugo version

      - uses: actions/configure-pages@v6
        id: pages

      - name: Build site
        env:
          HUGO_ENVIRONMENT: production
        run: hugo -s src --gc --minify --baseURL "https://www.kli.dk/"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./src/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
